<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio — 3D sketch scene</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8dfcc; overflow: hidden; }
    canvas#studio { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ui { position: fixed; inset: 0; pointer-events: none; font-family: 'DM Mono', ui-monospace, monospace; color: #0a45c4; }
    .ui h1 { position: absolute; left: 4vw; bottom: 6vh; margin: 0; max-width: 11em; font: 400 clamp(36px, 6vw, 92px)/0.95 'Instrument Serif', Georgia, serif; letter-spacing: -0.02em; color: #f3ecdc; text-shadow: 0 0 0 #0a45c4; mix-blend-mode: normal; }
    .ui h1 em { color: #0a45c4; }
    .ui p { position: absolute; right: 4vw; top: 4vh; margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #0a45c4; }
  </style>
</head>
<body>
  <canvas id="studio"></canvas>
  <div class="ui">
    <p>Drag to look around · Scroll to move closer</p>
    <h1>Design at the speed of <em>thought.</em></h1>
  </div>
  <script type="module" src="/src/versions/studio-v1-blue-static.js"></script>
</body>
</html>
